packages:
  - "packages/*"

# Turbopack's root is the repo root and it will not resolve packages that live
# outside it; the global virtual store would symlink dependencies to
# ~/Library/pnpm/store, so this repo keeps a project-local virtual store.
virtualStoreType: project

allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: false
  '@google/genai': false
  protobufjs: false

overrides:
  "undici@>=7.0.0 <7.28.0": "^7.28.0"
  "postcss@<8.5.10": "^8.5.10"
  "brace-expansion@>=5.0.0 <5.0.6": "^5.0.6"
  "esbuild@>=0.27.3 <0.28.1": "^0.28.1"
  # 1.3.1 calls React.createContext at module scope without "use client",
  # which crashes Next.js RSC builds; fixed in 1.3.3.
  "@radix-ui/react-slot@1.3.1": "^1.3.3"

minimumReleaseAgeExclude:
  - '@radix-ui/react-compose-refs@1.1.5'
  - '@radix-ui/react-slot@1.3.3'
